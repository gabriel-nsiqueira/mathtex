[package]
name = "mathtex-font"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "XeTeX font specs, host font loading, and OpenType metrics and math access for mathtex"
readme = "../../README.md"

[dependencies]
mathtex-ir = { version = "0.2.0", path = "../mathtex-ir" }
rustybuzz = "0.20.1"
self_cell = "1"
ttf-parser = { version = "0.25.1", default-features = false, features = [
    "std",
    "opentype-layout",
    "apple-layout",
    "variable-fonts",
    "glyph-names",
] }

[dev-dependencies]
mathtex-test-fixtures = { path = "../../tools/test-fixtures" }

[lints]
workspace = true
