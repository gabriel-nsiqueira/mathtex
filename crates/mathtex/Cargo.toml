[package]
name = "mathtex"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TeX math layout engine in Rust: LaTeX math to renderer neutral IR to SVG, natively and on wasm"
readme = "../../README.md"

[dependencies]
mathtex-engine = { version = "0.2.0", path = "../mathtex-engine" }
mathtex-font = { version = "0.2.0", path = "../mathtex-font" }
mathtex-ir = { version = "0.2.0", path = "../mathtex-ir" }
mathtex-svg = { version = "0.2.0", path = "../mathtex-svg" }

[lints]
workspace = true
