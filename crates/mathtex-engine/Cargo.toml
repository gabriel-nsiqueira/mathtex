[package]
name = "mathtex-engine"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "XeTeX engine for mathtex: baked formats, sandboxed math typesetting, host fonts and boxes, IR lowering"
readme = "../../README.md"
# Integration tests read a local TeX Live tree, which cannot ship in the package.
exclude = ["tests/"]

[dependencies]
mathtex-portable-engine-generated = { version = "=0.2.0", path = "../../generated/portable-engine" }
mathtex-font = { version = "0.2.0", path = "../mathtex-font" }
mathtex-ir = { version = "0.2.0", path = "../mathtex-ir" }
# Pure-Rust DEFLATE (wasm-friendly) used to compress packaged format images.
miniz_oxide = "0.8"

[dev-dependencies]
mathtex-svg = { path = "../mathtex-svg" }
mathtex-test-fixtures = { path = "../../tools/test-fixtures" }

[lints]
workspace = true
